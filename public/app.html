<!DOCTYPE html>
<html lang="id" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <script src="js/mode.js?v=5.6.0"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Asesmen Merdeka — Penilaian & Nilai Rapor</title>
  <meta name="description" content="Aplikasi asesmen Kurikulum Merdeka: Diagnostik, Formatif, Sumatif Lingkup Materi, STS, SAS, SAT, unggah soal PDF, ujian online, dan penghitungan nilai rapor otomatis.">
  <link rel="stylesheet" href="css/fonts.css?v=5.6.0">
  <link rel="stylesheet" href="css/style.css?v=5.6.0">
  <link rel="stylesheet" href="css/kuis.css?v=5.6.0">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/favicon-64.png">
  <meta name="theme-color" content="#16125a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Asesmen">
</head>
<body>
  <!-- Latar 3D -->
  <div class="scene" aria-hidden="true">
    <div class="shape cube s1"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i></div>
    <div class="shape ball s2"></div>
    <div class="shape ring s3"></div>
    <div class="shape cube s4"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i></div>
    <div class="shape ball s5"></div>
  </div>

  <div class="app">
    <nav class="rail" id="rail" aria-label="Bagian aplikasi"></nav>
    <aside class="sidebar" id="sidebar">
      <a class="side-head" href="#/beranda">
        <div><b id="side-title">Utama</b><small id="brand-sub">Penilaian &amp; Nilai Rapor</small></div>
        <small class="ver">v5.6</small>
      </a>
      <nav class="nav" id="nav"></nav>
    </aside>
    <div class="nav-backdrop" id="nav-backdrop"></div>

    <main class="main">
      <div class="topbar">
        <button class="btn ghost sm menu-btn" id="menu-btn" aria-label="Menu">☰</button>
        <div class="title" id="page-title"></div>
        <button class="mode-toggle" type="button" aria-label="Ganti mode">☀️</button>
        <div class="ctx" id="ctx"></div>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <div class="toasts" id="toasts"></div>
  <div id="modal-root"></div>
  <input type="file" id="file-input" class="hidden">

  <script src="lib/pdfjs/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'lib/pdfjs/pdf.worker.min.js';
  </script>
  <script src="js/art.js?v=5.6.0"></script>
  <script src="js/calc.js?v=5.6.0"></script>
  <script src="js/parser.js?v=5.6.0"></script>
  <script src="js/store.js?v=5.6.0"></script>
  <script src="js/qtypes.js?v=5.6.0"></script>
  <script src="js/panduan.js?v=5.6.0"></script>
  <script src="js/app.js?v=5.6.0"></script>
  <script src="js/music.js?v=5.6.0"></script>
  <script src="js/pwa.js?v=5.6.0"></script>
</body>
</html>
